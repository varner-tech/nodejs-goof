name: Snyk Release Monitor (long-lived versions)

# ============================================================================
# PURPOSE
# ============================================================================
# This workflow exists to demonstrate the "long-lived release monitoring"
# pattern Proconex asked about:
#
#   - On every release tag push, we push a NEW Snyk dashboard target tagged
#     with that version (--target-reference=vX.Y.Z). That target is then
#     monitored INDEFINITELY for newly-disclosed CVEs against its pinned
#     dependency tree.
#
#   - A weekly heartbeat job re-monitors every active release branch. This
#     keeps the snapshot "fresh" so it isn't auto-deactivated by any
#     org-level stale-project policy, and it confirms in the dashboard /
#     audit log that we are still actively tracking each released version.
#
#   - Notification routing (Slack / email / Jira) for any newly-detected
#     CVE on these versions is handled by Snyk org-level notification
#     settings -- no code change needed here.
# ============================================================================

on:
  # 1) Release pipeline: tag-driven. Any tag like v1.2.3 creates / updates
  #    its own Snyk monitored target.
  push:
    tags:
      - 'v*.*.*'

  # 2) Heartbeat: re-monitor every active release branch weekly so legacy
  #    versions don't go stale in the Snyk dashboard.
  schedule:
    - cron: '0 6 * * 1'   # Every Monday 06:00 UTC

  # 3) On-demand: lets you populate the demo dashboard from the UI.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to monitor (e.g. 1.2.0). Leave blank to read from package.json.'
        required: false
        default: ''

jobs:
  # --------------------------------------------------------------------------
  # JOB 1: Release-tag monitor.
  # Fires only on tag push. Reads the tag name, monitors that exact code.
  # --------------------------------------------------------------------------
  monitor-release-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Monitor release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout tagged code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      - name: Authenticate Snyk
        run: snyk auth "$SNYK_TOKEN"
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Push Snyk monitor snapshot for ${{ github.ref_name }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          # github.ref_name is the tag, e.g. "v1.2.0" -- strip the leading v
          # so VERSION matches package.json semver.
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          export VERSION
          ./scripts/snyk-monitor-release.sh

  # --------------------------------------------------------------------------
  # JOB 2: Heartbeat for legacy release branches.
  # Fires on the weekly schedule (and manual dispatch). Checks out each
  # active release/* branch and re-runs the monitor script so the dashboard
  # target stays "live".
  # --------------------------------------------------------------------------
  monitor-active-releases:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Heartbeat-monitor release/${{ matrix.branch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # ----------------------------------------------------------------
        # Edit this list as Proconex (or you) ship new versions.
        # Drop a version from the matrix when it's truly end-of-life and
        # you no longer want notifications for it.
        # ----------------------------------------------------------------
        branch:
          - v1.0
          - v1.1
          - v1.2
          - v2.0

    steps:
      - name: Checkout release/${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: release/${{ matrix.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      - name: Authenticate Snyk
        run: snyk auth "$SNYK_TOKEN"
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Heartbeat monitor for release/${{ matrix.branch }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: ./scripts/snyk-monitor-release.sh
