# ============================================================================
# Snyk SCA & SAST Security Pipeline for GitHub Actions
# ============================================================================
#
# WHAT THIS DOES:
#   This workflow integrates Snyk into your CI/CD pipeline to automatically
#   scan for security vulnerabilities on every push and pull request. It runs
#   two independent, parallel jobs:
#
#   1. SCA (Software Composition Analysis) - Scans your open-source
#      dependencies (e.g., npm packages) for known vulnerabilities.
#   2. SAST (Static Application Security Testing) - Scans your first-party
#      source code for security issues like SQL injection, XSS, and more.
#
#   Both jobs generate a downloadable HTML report and send results to the
#   Snyk Dashboard for continuous monitoring.
#
# PREREQUISITES:
#   1. A Snyk account (free tier works) — https://app.snyk.io
#   2. A Snyk API token — https://app.snyk.io/account (API Token section)
#   3. Your Snyk Organization ID — found in Snyk under Settings > General
#   4. The SNYK_TOKEN secret configured in your GitHub repo:
#        Repo > Settings > Secrets and variables > Actions > New repository secret
#        Name:  SNYK_TOKEN
#        Value: <your Snyk API token>
#
# CUSTOMIZATION:
#   - Adjust --severity-threshold to control what blocks the pipeline.
#     Valid values: low | medium | high | critical
#   - Replace the --org value with your own Snyk Organization ID.
#   - Replace --project-name values to match your project naming convention.
#   - Uncomment the pull_request trigger to gate PRs before merge.
#   - To add Container or IaC scanning, see the Snyk Actions docs:
#     https://github.com/snyk/actions
# ============================================================================

name: Snyk SCA and SAST Security Pipeline

# ============================================================================
# TRIGGER CONFIGURATION
# ============================================================================
# push:              Runs on every push to main/master (post-merge scanning).
# pull_request:      (Commented out) Uncomment to scan PRs before merging.
# workflow_dispatch: Allows manual runs from the GitHub Actions UI.
on:
  push:
    branches: [ main, master ]
  # pull_request:
  #   branches: [ main, master ]
  workflow_dispatch:

# ============================================================================
# Both jobs below run in PARALLEL. Neither depends on the other, so you will
# always see results from both SCA and SAST even if one of them fails.
# ============================================================================
jobs:

  # ==========================================================================
  # JOB 1: SCA — Snyk Open Source Scan
  # ==========================================================================
  # Scans your dependency tree (package.json / package-lock.json) against the
  # Snyk vulnerability database. This catches known CVEs in third-party
  # packages before they reach production.
  #
  # Gating policy: FAILS the pipeline on HIGH or CRITICAL severity issues.
  # ==========================================================================
  snyk-sca-scan:
    name: SCA - Snyk Open Source Scan
    runs-on: ubuntu-latest

    # "contents: read"        — needed to check out your code
    # "security-events: write" — needed if you later add SARIF upload to
    #                            GitHub's Security tab (optional enhancement)
    permissions:
      contents: read
      security-events: write

    steps:
      # -- Checkout the repository so Snyk can access your code and manifests --
      - name: Checkout code
        uses: actions/checkout@v4

      # -- Set up the Node.js runtime (required for npm install) --
      # Change the version to match your project's requirements.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # -- Install dependencies so Snyk can resolve the full dependency tree --
      # Snyk needs the node_modules / lock file to accurately identify
      # transitive dependencies and their versions.
      - name: Install dependencies
        run: npm install

      # -- Install the Snyk CLI using the official GitHub Action --
      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      # -- Authenticate the CLI with your Snyk API token --
      # The SNYK_TOKEN secret must be configured in your repository settings.
      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # -- Run the SCA scan --
      # Flags explained:
      #   --severity-threshold=high   Only fail on high or critical findings.
      #   --json                      Output results as JSON (for HTML report).
      #   --report                    Also send results to the Snyk Dashboard.
      #   --org                       Your Snyk Organization ID.
      #   --project-name              Name shown in the Snyk Dashboard.
      #   --target-reference          Tags results with the branch/tag name.
      #
      # The JSON output is piped to "npx snyk-to-html" which generates a
      # human-readable HTML report saved as snyk-sca-report.html.
      #
      # "continue-on-error: true" lets the job proceed to upload the report
      # even when vulnerabilities are found. The gate is enforced in the
      # "Evaluate" step below.
      - name: Snyk Open Source Test (Gate on High/Critical)
        id: sca-scan
        continue-on-error: true
        run: |
          snyk test \
            --severity-threshold=high \
            --json \
            --report \
            --org=2c2549f7-de55-4c31-aaea-bea685244487 \
            --project-name="nodejs-goof-sca" \
            --target-reference=${{ github.ref_name }} | npx snyk-to-html -o snyk-sca-report.html
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # -- Upload the HTML report as a downloadable artifact --
      # "if: always()" ensures the report is uploaded whether the scan
      # passed or failed. Find it in the Actions run under "Artifacts".
      - name: Upload SCA HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-sca-report
          path: snyk-sca-report.html

      # -- Enforce the gate: fail the job if vulnerabilities were found --
      # This step checks the outcome of the scan step. If it failed
      # (vulnerabilities at or above the threshold), this exits non-zero
      # to mark the job as failed in the GitHub Actions UI.
      - name: Evaluate SCA scan result
        if: steps.sca-scan.outcome == 'failure'
        run: exit 1

  # ==========================================================================
  # JOB 2: SAST — Snyk Code Scan
  # ==========================================================================
  # Scans your first-party source code for security vulnerabilities using
  # Snyk's static analysis engine. Catches issues like SQL injection, XSS,
  # path traversal, hardcoded secrets, and more — directly in your code.
  #
  # Gating policy: FAILS the pipeline on MEDIUM or higher severity issues.
  # ==========================================================================
  snyk-code-scan:
    name: SAST - Snyk Code Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      # -- Checkout the repository --
      - name: Checkout code
        uses: actions/checkout@v4

      # -- Install the Snyk CLI --
      # Note: SAST does not require "npm install" — Snyk Code analyzes
      # source files directly without needing to build the project.
      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      # -- Authenticate the CLI --
      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # -- Run the SAST scan --
      # Flags explained:
      #   --severity-threshold=medium  Fail on medium, high, or critical findings.
      #   --json                       Output results as JSON (for HTML report).
      #   --report                     Also send results to the Snyk Dashboard.
      #   --org                        Your Snyk Organization ID.
      #   --project-name               Name shown in the Snyk Dashboard.
      #
      # Same pattern as SCA: JSON is piped to snyk-to-html, and
      # continue-on-error allows the artifact upload to run before gating.
      - name: Snyk Code Test (Gate on Medium+)
        id: sast-scan
        continue-on-error: true
        run: |
          snyk code test \
            --severity-threshold=medium \
            --json \
            --report \
            --org=2c2549f7-de55-4c31-aaea-bea685244487 \
            --project-name="nodejs-goof-sast" | npx snyk-to-html -o snyk-sast-report.html
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # -- Upload the SAST HTML report as a downloadable artifact --
      - name: Upload SAST HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-sast-report
          path: snyk-sast-report.html

      # -- Enforce the gate --
      - name: Evaluate SAST scan result
        if: steps.sast-scan.outcome == 'failure'
        run: exit 1

# ============================================================================
# VIEWING RESULTS
# ============================================================================
# 1. GitHub Actions UI:
#    - Each job shows pass/fail status in the Actions tab.
#    - Download the HTML reports from the "Artifacts" section of any run.
#
# 2. Snyk Dashboard:
#    - The --report flag sends results to your Snyk organization.
#    - View them at: https://app.snyk.io → your org → Projects
#    - Look for project names: nodejs-goof-sca and nodejs-goof-sast
#
# ============================================================================
# NEXT STEPS / EXTENDING THIS PIPELINE
# ============================================================================
# - Uncomment the pull_request trigger above to gate PRs before merge.
# - Add Snyk Container scanning to test your Docker images:
#     snyk container test <image> --file=Dockerfile
# - Add Snyk IaC scanning to test Terraform, CloudFormation, etc.:
#     snyk iac test <file-or-directory>
# - Generate an SBOM (Software Bill of Materials):
#     snyk sbom --format=cyclonedx1.6+json
# - Upload SARIF results to GitHub's Security tab for native integration:
#     snyk test --sarif-file-output=snyk.sarif
#     then use github/codeql-action/upload-sarif@v2
# ============================================================================
